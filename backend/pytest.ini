# The repo's only pytest config; also fixes the rootdir when run from elsewhere.
#
# `asyncio_mode = auto` lets pytest-asyncio run bare `async def test_*` functions
# without @pytest.mark.asyncio. Without it, four tests in tests/test_api_endpoints.py
# and tests/test_ollama_backend.py are skipped as un-awaited coroutines and reported
# as failures.
[pytest]
asyncio_mode = auto
